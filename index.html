<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Guía de países y destinos del mundo" />
    <meta name="theme-color" content="#1e293b" />
    
    <title>ExploraMundo</title>

    
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <header class="header">
      <a href="#/" class="header__logo">
        <img src="./logo.png" alt="Logo ExploraMundo" class="header__logo-img" width="38" height="38" />

        <span class="logo-text">Explora<span class="logo-accent">Mundo</span></span>
      </a>

      <nav class="header__nav" aria-label="Navegación principal de escritorio">
        <a href="#/" class="nav-item" data-route="/">Inicio</a>
        <a href="#/busqueda" class="nav-item" data-route="/busqueda">Buscar</a>
        <a href="#/deseos" class="nav-item" data-route="/deseos">Deseos</a>
        <a href="#/historial" class="nav-item" data-route="/historial">Historial</a>
        <a href="#/contacto" class="nav-item" data-route="/contacto">Contacto</a>
      </nav>
    </header>


    <main id="app" class="container" role="main" aria-live="polite">
    </main>

    <footer class="footer">
      <div class="footer__content">
        <p class="footer__brand"><strong>ExploraMundo</strong></p>
        <p class="footer__copy">© 2026 — Desarrollado por Federico Busum Fradera / Matías Galván</p>
      </div>
    </footer>


    <nav class="bottom-nav" aria-label="Navegación inferior móvil">
      <a href="#/" class="nav-item" data-route="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Inicio</span>
      </a>

      <a href="#/busqueda" class="nav-item" data-route="/busqueda">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>Buscar</span>
      </a>

      <a href="#/deseos" class="nav-item" data-route="/deseos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        <span>Deseos</span>
      </a>

      <a href="#/historial" class="nav-item" data-route="/historial">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span>Historial</span>
      </a>

      <a href="#/contacto" class="nav-item" data-route="/contacto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Contacto</span>
      </a>
    </nav>


    <div id="modal-root" aria-hidden="true"></div>
    <div id="toast-root" aria-live="assertive"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
